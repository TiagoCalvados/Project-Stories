<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1116">
<meta name="description" content="Tiago K's evolving collection of audiovisual experiments and short films.">
<title>Audiovisual — Tiago K</title>
<style>
  :root {color-scheme:dark;--bg:#0c1116;--ink:#f3f1eb;--soft:#bac6cb;--muted:#84979e;--line:#2a373b;--accent:#8ddfd9;}
  * {box-sizing:border-box;}
  html {background:var(--bg);}
  body {margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  button {font:inherit;}
  .page {width:min(100%,1160px);height:100vh;height:100svh;margin:auto;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;}
  a {color:inherit;}
  .hero {padding:0 0 14px;border-bottom:1px solid var(--line);}
  .hero-top {display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .home {display:grid;place-items:center;width:32px;height:32px;color:var(--accent);text-decoration:none;font-size:23px;line-height:1;border:1px solid var(--line);border-radius:50%;}
  .home:hover {border-color:var(--accent);}
  .play-movie {display:inline-flex;align-items:center;justify-content:center;gap:8px;
     background:var(--accent);color:#071517!important;font-size:11px!important;font-weight:700;
     letter-spacing:.075em;text-transform:uppercase;padding:10px 16px;text-decoration:none;
     white-space:nowrap;border-radius:2px;}
  .play-movie:hover {background:#b9fff9;}
  .film-source {display:inline-block;margin-top:2px;color:var(--accent);font-size:11px;text-decoration:underline;text-underline-offset:3px;}
  .film-source:hover {color:#b9fff9;}
  .eyebrow {font-size:10px;font-weight:bold;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);}
  .hero-title {display:flex;justify-content:space-between;gap:20px;align-items:center;}
  .hero-title-main {display:flex;align-items:center;gap:17px;min-width:0;}
  h1 {font-size:clamp(27px,4.6vw,41px);line-height:1.18;letter-spacing:-.035em;font-weight:500;margin:8px 0 10px;}
  .hero-count {font-size:12px;font-weight:normal;letter-spacing:.1em;color:var(--muted);white-space:nowrap;}
  .tagline {color:var(--ink);font:italic clamp(14px,1.65vw,17px)/1.35 Georgia,serif;margin:0 0 9px;}
  .about {padding:0;border:0;background:none;color:var(--soft);font-size:11px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  .about:hover {color:var(--accent);}
  .archive {display:flex;flex-direction:column;min-height:0;gap:10px;}
  .sectionbar {display:flex;justify-content:space-between;align-items:center;gap:18px;}
  .sectionbar h2 {font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin:0;}
  .sectionbar span {font-size:10px;color:var(--muted);}
  #films {flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;}
  .film {min-width:0;min-height:0;}
  .film-card {width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;padding:clamp(12px,2vw,24px);color:var(--ink);background:#111a20;border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:background .15s,border-color .15s;}
  .film-card:hover {background:#17262c;border-color:var(--accent);}
  :is(button,a):focus-visible {outline:2px solid var(--accent);outline-offset:3px;}
  .film-meta {display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .number {color:var(--accent);font-size:12px;font-weight:bold;}
  .name {font-size:clamp(15px,1.65vw,20px);line-height:1.25;font-weight:500;display:block;}
  .description {color:var(--soft);font-size:12px;line-height:1.4;display:block;}
  .year {font-size:10px;color:var(--muted);margin-right:auto;}
  .duration {font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .notes {color:var(--soft);font-size:13px;line-height:1.6;}
  .notes p {margin:0 0 12px;max-width:770px;}
  .specs {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:12px;}
  .specs div {min-width:0;}
  .specs dt {color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;}
  .specs dd {color:var(--ink);margin:2px 0 0;font-size:11px;}
  .credits {font-size:11px;color:var(--muted);margin-top:12px!important;}
  .credits strong {font-weight:500;color:var(--soft);}
  .bottom {color:var(--muted);font-size:10px;}
  .film-dialog {width:min(680px,calc(100% - 32px));max-height:calc(100vh - 32px);max-height:calc(100svh - 32px);padding:24px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);overflow:auto;}
  .film-dialog::backdrop {background:#020609d9;backdrop-filter:blur(5px);}
  .dialog-header {display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px;}
  .dialog-title {font-size:22px;line-height:1.25;font-weight:500;margin:0;}
  .close-dialog {flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--accent);font-size:25px;line-height:1;cursor:pointer;}
  .close-dialog:hover {border-color:var(--accent);}
  .dialog-intro {color:var(--ink);}
  @media (min-width:601px) and (max-height:600px){
    .page {padding:12px 20px;gap:10px;}
    .hero {padding-bottom:8px;}
    .hero-top {height:24px;}
    .home {width:26px;height:26px;font-size:20px;}
    h1 {font-size:30px;margin:2px 0 5px;}
    .tagline {font-size:14px;margin-bottom:3px;}
    .film-card {padding:10px 14px;gap:6px;}
    .name {font-size:15px;}
    .description {font-size:11px;}
    .archive {gap:6px;}
    #films {gap:8px;}
  }
  @media (max-width:600px){
    .page {padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:10px;}
    .hero {padding-bottom:10px;}
    .hero-top {height:28px;}
    .home {width:28px;height:28px;font-size:21px;}
    h1 {margin:5px 0 8px;font-size:28px;}
    .hero-count {font-size:10px;}
    .hero-title-main {gap:10px;}
    .tagline {font-size:14px;margin-bottom:7px;}
    .sectionbar {gap:8px;}
    .sectionbar span {font-size:9px;}
    .archive {gap:8px;}
    #films {grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;}
    .film-card {padding:10px;gap:6px;}
    .name {font-size:13px;line-height:1.22;}
    .description {font-size:11px;line-height:1.3;}
    .number {font-size:10px;}
    .year {font-size:9px;}
    .duration {font-size:10px;}
    .specs {grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
    .bottom {font-size:9px;}
    .play-movie {padding:9px 11px;font-size:10px!important;}
    .film-dialog {padding:18px;}
    .dialog-title {font-size:19px;}
  }
  @media (max-width:600px) and (max-height:650px){
    .page {padding:10px 12px;gap:8px;}
    .hero-top {height:24px;}
    .home {width:24px;height:24px;font-size:18px;}
    .hero {padding-bottom:7px;}
    h1 {font-size:25px;margin:2px 0 5px;}
    .tagline {font-size:12px;margin-bottom:4px;}
    .hero-count {display:none;}
    .film-card {padding:8px;gap:4px;}
    .name {font-size:12px;}
    .description {font-size:10.5px;}
  }
  @media (max-height:450px) and (min-width:601px){
    .hero-top {position:absolute;right:20px;top:12px;}
    .hero-title {padding-right:40px;}
    .eyebrow {display:none;}
    .hero-count {display:none;}
  }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="hero-top"><span class="eyebrow">Sound · image · experimentation</span><a href="/" class="home" aria-label="Back to the main page">←</a></div>
    <div class="hero-title"><div class="hero-title-main"><h1>Audiovisual</h1><a class="play-movie" href="audiovisual.html" aria-label="Play the complete movie made of six connected parts">▶ Play movie</a></div><span class="hero-count" id="total">06 films</span></div>
    <p class="tagline">Different years. Different tools. The same restless curiosity.</p>
    <button class="about" id="about-films" type="button" aria-haspopup="dialog" aria-controls="film-dialog">About these films</button>
  </header>
  <section class="archive" aria-labelledby="film-heading">
    <div class="sectionbar"><h2 id="film-heading">The films</h2><span>Tap a film for its story &amp; credits</span></div>
    <div id="films"></div>
  </section>
  <footer class="bottom">
    <span class="footnote">One connected film · Six parts · A growing audiovisual archive.</span>

  </footer>
</main>
<dialog class="film-dialog" id="film-dialog" aria-labelledby="dialog-title">
  <div class="dialog-header"><h2 class="dialog-title" id="dialog-title"></h2><button class="close-dialog" type="button" aria-label="Close film details" autofocus>×</button></div>
  <div class="notes" id="dialog-notes"></div>
</dialog>
<script>
/*
   AUDIOVISUAL ARCHIVE — EDIT FILMS HERE.
   These six entries match 1.mp4 through 6.mp4 IN ORDER.
   All six films play as one sequence through the single PLAY MOVIE button.
   New film? Add an object to the array, and update the existing playback page.
   "File modified" dates are computer file dates, not production dates.
   Film 5/6 names are working titles until confirmed from the original Vimeo pages.
*/
const FILMS = [
  {
    file:'1.mp4', title:'Amsterdam West — Attic Reflections', year:'2026', duration:'1:36', size:'1920 × 1080', updated:'12 Sep 2026',
    short:'The street outside, projected light on glass, and M83 on vinyl.',
    story:'Recorded from my attic in Amsterdam West, looking onto the street. I was playing M83’s album Digital Shades Vol. 1 on vinyl in the background. A small light-projecting gadget created shifting, strobe-like reflections on the window. The street, the glass and the music became a single audiovisual moment.',
    credits:'Location: Amsterdam West, Netherlands. Sound in the room: M83 — Digital Shades Vol. 1, played on vinyl.'
  },
  {
    file:'2.mp4', title:'Water / Grid / AI / Franky Fugazy', year:'2026', duration:'0:27', size:'960 × 1706', updated:'2 Oct 2026',
    short:'Portugal’s summer water meets an industrial fan in Amsterdam.',
    story:'I combined two pieces of footage from completely different places: moving water I filmed in Portugal during summer, and a huge industrial fan operating at my workplace in Amsterdam. The fan creates the apparent grid. These images are layered with guitar from my friend Franky Fugazy’s new album and an AI voice reading conceptual text developed in earlier conversations.',
    credits:'Footage: Portugal and Amsterdam. Guitar: Franky Fugazy. Spoken voice: AI narration. Concept and visual combination: Tiago.'
  },
  {
    file:'3.mp4', title:'The Beach Boy and the Sun', year:'Summer 2026', duration:'10:54', size:'1080 × 1920', updated:'5 Oct 2026',
    short:'Jumping in the water and the sun connection as the nervous system regulator.',
    story:'Summer 2026 — The Beach Boy and the Sun. Jumping in the water and the connection with the sun as a regulator of the nervous system. This is the concept described in the film’s original opening frame.',
    credits:'Original summer footage and film by Tiago.'
  },
  {
    file:'4.mp4', title:'Into the Digital World', year:'2026', duration:'1:39', size:'1920 × 800', updated:'20 Sep 2026',
    short:'An entirely AI-created passage into a digital environment.',
    story:'Unlike the earlier films built from real footage, this piece is created entirely with AI. My fictional character is already digitalized and moving through a constructed digital world — another step in the transition from physical places and layered memories into imagined virtual space.',
    credits:'Visual world and character created with AI; concept and direction: Tiago.'
  },
  {
    file:'5.mp4', title:'Experience 1', year:'Early work', duration:'6:42', size:'400 × 272', updated:'3 Oct 2026',
    short:'An early experiment with a tree blowing outside the window.',
    story:'One of my early Vimeo audiovisual experiments. The starting point was a tree moving outside my window, with the real sound of the wind and tree captured in the recording. The original footage and sound made an everyday scene into an experiment. The film’s original Vimeo description and title still need confirmation.',
    credits:'Original early Vimeo film; filmed and recorded by Tiago.',
    source:'https://vimeo.com/4030744', sourceLabel:'Original Vimeo film 5 ↗'
  },
  {
    file:'6.mp4', title:'Fragments: The Unknown War', year:'Early work', duration:'5:45', size:'640 × 480', updated:'3 Oct 2026',
    short:'A second early audiovisual work preserved from Vimeo.',
    story:'An earlier audiovisual piece from my original Vimeo archive, created before the recent AI experiments. I previously shared this video when I recovered my old Vimeo account. The original Vimeo page has more information, but its description could not be verified here, so I am leaving the film’s subject and credits open rather than inventing them.',
    credits:'Original early Vimeo film. Title and complete credits pending verification from the original page.',
    source:'https://vimeo.com/4078555', sourceLabel:'Original Vimeo film 6 ↗'
  }
];

const list=document.getElementById('films');
const dialog=document.getElementById('film-dialog');
const dialogTitle=document.getElementById('dialog-title');
const dialogNotes=document.getElementById('dialog-notes');
const PREVIEWS = [
  'Amsterdam street, reflected light, M83 on vinyl.',
  'Portugal’s water, an Amsterdam fan, guitar and AI.',
  'Summer water, sunlight and the nervous system.',
  'An AI-created passage into a digital world.',
  'A tree, the wind, an early audiovisual experiment.',
  'An early audiovisual work, recovered from Vimeo.'
];
document.getElementById('total').textContent=String(FILMS.length).padStart(2,'0')+' films';
function node(tag, cls, value) {const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el;}
function openDetails(title, content) {
  dialogTitle.textContent=title;
  dialogNotes.replaceChildren(content);
  dialog.showModal();
  dialog.scrollTop=0;
}
document.querySelector('.close-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{
  if(event.target!==dialog)return;
  const rect=dialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
});
document.getElementById('about-films').addEventListener('click',()=>{
  const content=node('p','',"It began with simple experiments: a tree moving outside my window, the sound of the wind, and the urge to turn an ordinary moment into something else. Years later, that same instinct keeps resurfacing — through music, movement, memory and new digital possibilities. These films don't follow one genre; they follow curiosity.");
  openDetails('About these films',content);
});
FILMS.forEach((f,i)=>{
  const article=node('article','film');
  const card=node('button','film-card');
  card.type='button';
  card.setAttribute('aria-haspopup','dialog');
  card.setAttribute('aria-controls','film-dialog');
  card.setAttribute('aria-label','Film '+(i+1)+': '+f.title+' — story and credits');
  const meta=node('span','film-meta');
  meta.append(node('span','number',String(i+1).padStart(2,'0')),node('span','year',f.year),node('span','duration',f.duration));
  card.append(meta,node('span','name',f.title),node('span','description',PREVIEWS[i]||f.short));
  const expanded=node('div','notes');
  expanded.append(node('p','dialog-intro',f.short),node('p','',f.story));
  const dl=node('dl','specs');
  [['File',f.file],['Film length',f.duration],['File modified',f.updated],['Frame size',f.size]].forEach(([key,value])=>{
    const pair=node('div');pair.append(node('dt','',key),node('dd','',value));dl.append(pair);
  });
  expanded.append(dl);
  if(f.credits){const p=node('p','credits');p.append(node('strong','', 'Notes  '),document.createTextNode(f.credits));expanded.append(p);}
  if(f.source){const a=node('a','film-source',f.sourceLabel||'Original Vimeo ↗');a.href=f.source;a.target='_blank';a.rel='noopener noreferrer';expanded.append(a);}
  card.addEventListener('click',()=>openDetails(f.title,expanded));
  article.append(card);list.append(article);
});
</script>
</body>
</html>
