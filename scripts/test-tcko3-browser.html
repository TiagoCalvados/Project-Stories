<!doctype html><meta name="viewport" content="width=device-width"><title>Music audio checks</title><style>body{font:16px system-ui;background:#15201c;color:#c9f5dc;padding:25px}button{padding:15px}pre{white-space:pre-wrap}</style><h1>Local music verification</h1><button id="run">Run audio checks</button><pre id="report">Ready.</pre><script type="module">
import {EFFECTS,createEffects} from '/tcko3-effects.js';
import {saveTake,readTake,recentTakes} from '/music-library.js';
import {encodeWav} from '/tcko2-recording.js';
const report=document.querySelector('#report');
async function render(enabled,depth=.7){const ctx=new OfflineAudioContext(2,44100,44100),rack=createEffects(ctx),buffer=ctx.createBuffer(2,44100,44100);for(let c=0;c<2;c++){const data=buffer.getChannelData(c);for(let i=0;i<data.length;i++)data[i]=.2*Math.sin(2*Math.PI*(220+c*110)*i/44100)+.08*Math.sin(2*Math.PI*880*i/44100);}const source=ctx.createBufferSource();source.buffer=buffer;source.connect(rack.input);rack.output.connect(ctx.destination);rack.update(new Set(enabled),depth);source.start();return (await ctx.startRendering()).getChannelData(0);}
function check(ok,label){if(!ok)throw Error(label);report.textContent+='PASS: '+label+'\n';}
document.querySelector('#run').onclick=async()=>{report.textContent='';try{const dry=await render([]);for(const [name] of EFFECTS){const wet=await render([name]);let difference=0,finite=true;for(let i=12000;i<wet.length;i++){difference+=Math.abs(wet[i]-dry[i]);finite&&=Number.isFinite(wet[i])&&Math.abs(wet[i])<2;}check(finite&&difference>1,name+' changes real audio and stays finite');const bypass=await render([name],0);check(bypass.every((value,i)=>Math.abs(value-dry[i])<.000001),name+' zero amount is dry');}const all=await render(EFFECTS.map(([name])=>name),1);check(all.every(v=>Number.isFinite(v)&&Math.abs(v)<2),'all six effects combine safely');const data=new Int16Array(4410*2);for(let i=0;i<data.length;i++)data[i]=Math.sin(i*.1)*3000;const blob=encodeWav([data.buffer],44100),id=await saveTake({name:'TCKO2-local-verification.wav',blob,duration:.1});const restored=await readTake(id);check(restored.blob.size===blob.size&&restored.duration===.1,'device-only take saves and restores WAV');check((await recentTakes()).some(t=>t.id===id),'take appears in recent recordings');report.textContent+='RESULT: PASS';}catch(e){report.textContent+='RESULT: FAIL '+e.message;}};
</script>
